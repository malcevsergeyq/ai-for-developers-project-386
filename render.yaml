# Blueprint для Render: описывает деплой в репозитории, чтобы настройку
# не приходилось повторять руками через веб-интерфейс.
#
# DATABASE_URL здесь намеренно нет. Postgres-ветка кода не исполнялась ни разу
# (см. «Открытые вопросы» в PLAN.md), поэтому сервис поднимается на хранилище
# в памяти: данные сбрасываются при перезапуске, что ТЗ прямо разрешает.
# Добавлять переменную можно только после того, как схема хотя бы раз накатана.
services:
  - type: web
    name: calendar-booking
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render сам подставит PORT в окружение контейнера — задавать его здесь не нужно.
    healthCheckPath: /event-types
    envVars:
      - key: NODE_ENV
        value: production
